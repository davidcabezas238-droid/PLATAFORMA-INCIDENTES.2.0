databases:
  - name: plataforma-incidentes-db
    databaseName: plataforma_incidentes
    user: plataforma_incidentes
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: plataforma-incidentes
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: evidencias-incidentes
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: plataforma-incidentes-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: plataforma-incidentes-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
