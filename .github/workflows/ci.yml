name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: incidentes
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d incidentes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: BACK-END
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/incidentes?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/incidentes?schema=public
      JWT_SECRET: ci-only-secret-not-used-outside-tests
      STORAGE_DRIVER: local

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BACK-END/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --test-force-exit --test-concurrency=1 --test-reporter=spec

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: render-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://plataforma-incidentes-ggeo.onrender.com
    steps:
      - name: Validate deployment secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?Configure the production environment secret RENDER_API_KEY}"
          : "${RENDER_SERVICE_ID:?Configure the production environment secret RENDER_SERVICE_ID}"

      - name: Verify Render service configuration
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          service="$(curl --fail --silent --show-error --max-time 30 \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
            --header "Authorization: ******")"
          service_name="$(jq -er '.name' <<< "$service")"
          auto_deploy="$(jq -er '.autoDeployTrigger' <<< "$service")"

          if [[ "$service_name" != "plataforma-incidentes" ]]; then
            echo "RENDER_SERVICE_ID points to '$service_name', not plataforma-incidentes" >&2
            exit 1
          fi
          if [[ "$auto_deploy" != "off" ]]; then
            echo "Disable Render Auto-Deploy before running production CD (current: $auto_deploy)" >&2
            exit 1
          fi
          echo "Render service and Auto-Deploy configuration verified"

      - name: Trigger deployment for the verified commit
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error --max-time 30 \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg commitId "$COMMIT_SHA" '{commitId: $commitId}')")"
          deploy_id="$(jq -er '.id' <<< "$response")"
          deploy_commit="$(jq -er '.commit.id' <<< "$response")"

          if [[ "$deploy_commit" != "$COMMIT_SHA" ]]; then
            echo "Render queued commit $deploy_commit instead of verified commit $COMMIT_SHA" >&2
            exit 1
          fi

          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Render accepted deploy $deploy_id for commit $deploy_commit"

      - name: Wait for Render deployment and health check
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
          COMMIT_SHA: ${{ github.sha }}
          HEALTHCHECK_URL: https://plataforma-incidentes-ggeo.onrender.com/healthz
        run: |
          set -euo pipefail
          deploy_url="https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}"
          deploy_status=""

          for attempt in {1..60}; do
            response="$(curl --fail --silent --show-error --max-time 15 \
              --url "$deploy_url" \
              --header "Authorization: Bearer ${RENDER_API_KEY}")"
            deploy_status="$(jq -er '.status' <<< "$response")"
            deploy_commit="$(jq -er '.commit.id' <<< "$response")"

            if [[ "$deploy_commit" != "$COMMIT_SHA" ]]; then
              echo "Render deployment $DEPLOY_ID is for unexpected commit $deploy_commit" >&2
              exit 1
            fi

            case "$deploy_status" in
              live)
                echo "Render reports deployment $DEPLOY_ID live for $deploy_commit"
                break
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Render deployment $DEPLOY_ID ended with status $deploy_status" >&2
                exit 1
                ;;
              created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                echo "Deployment status: $deploy_status (attempt $attempt/60)"
                sleep 10
                ;;
              *)
                echo "Unexpected Render deployment status: $deploy_status" >&2
                exit 1
                ;;
            esac
          done

          if [[ "$deploy_status" != "live" ]]; then
            echo "Timed out waiting for Render deployment $DEPLOY_ID" >&2
            exit 1
          fi

          for attempt in {1..12}; do
            if health="$(curl --fail --silent --show-error --max-time 15 \
              --location "$HEALTHCHECK_URL")" &&
              [[ "$(jq -er '.status' <<< "$health")" == "ok" ]]; then
              echo "Production health check passed for commit $COMMIT_SHA"
              exit 0
            fi

            echo "Waiting for production health check (attempt $attempt/12)"
            sleep 5
          done

          echo "Render deployment is live, but the production health check did not pass" >&2
          exit 1
